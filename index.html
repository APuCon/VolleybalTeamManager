<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#142138">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>VolleybalTeamManager</title>
  <style>
    :root{
      --n:#142138;
      --p:#1c2c49;
      --l:#26395d;
      --t:#edf1f8;
      --d:#9ca8bd;
      --o:#ed9a3b;
      --r:#c45d50;
      --g:#65b781;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(160deg,#172944,var(--n));color:var(--t)}
    body{min-height:100vh}
    .shell{max-width:1200px;margin:0 auto;padding:20px}
    .top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:8px 0 18px}
    .brand{font-size:1.75rem;font-weight:700;letter-spacing:.02em}
    .muted{color:var(--d);font-size:.92rem}
    .auth{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .btn,.input,select{font:inherit}
    .btn{
      appearance:none;border:none;border-radius:10px;padding:10px 14px;background:#f2f6ff;color:#0e1830;font-weight:600;cursor:pointer;transition:.15s ease;box-shadow:0 4px 12px rgba(0,0,0,.15)
    }
    .btn:hover{filter:brightness(1.05)}
    .btn2{background:transparent;border:1px solid rgba(255,255,255,.18);color:var(--t)}
    .btn.danger{background:var(--r);color:white}
    .card{
      background:rgba(20,33,56,.72);
      border:1px solid rgba(255,255,255,.08);
      border-radius:16px;
      padding:18px;
      box-shadow:0 12px 30px rgba(0,0,0,.15);
      backdrop-filter:blur(6px);
    }
    #app{display:grid;gap:16px}
    .row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:8px 0}
    .row-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
    .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
    .stat{font-size:2rem;font-weight:700}
    .pill{
      display:inline-flex;align-items:center;justify-content:center;padding:5px 10px;border-radius:999px;
      background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);font-size:.8rem;font-weight:600;color:var(--t)
    }
    .team{cursor:pointer}
    .team:hover{border-color:rgba(255,255,255,.24)}
    .input,select{
      width:100%;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.04);color:var(--t);outline:none
    }
    .input::placeholder{color:var(--d)}
    .menu-button{display:inline-flex;align-items:center;gap:8px}
    .menu-icon{font-size:1.24rem}
    .menu-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:30}
    .menu-overlay.open{display:block}
    .menu-drawer{
      position:fixed;top:0;right:0;bottom:0;width:min(320px,80vw);background:#111f35;border-left:1px solid rgba(255,255,255,.1);
      padding:20px;display:none;flex-direction:column;gap:12px;z-index:31
    }
    .menu-drawer.open{display:flex}
    .menu-current{background:rgba(255,255,255,.08)}
    .section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .tab-pane{display:grid;gap:16px}
    .muted-link{color:#dfe9ff;text-decoration:none}
    a{color:inherit}
    .spacer{height:8px}
    @media(max-width:700px){.top{align-items:flex-start;flex-direction:column}.brand{font-size:1.45rem}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="top">
      <div>
        <div class="brand">VolleybalTeamManager</div>
        <div class="muted">Teams, spelers, wedstrijden, live score en rotaties</div>
      </div>
      <div id="auth" class="auth"></div>
    </header>
    <main id="app">
      <div class="card">Laden...</div>
    </main>
  </div>

  <div id="menuOverlay" class="menu-overlay" onclick="closeMenu()"></div>
  <div id="menuDrawer" class="menu-drawer" aria-hidden="true"></div>

  <script>
    let principal = null;
    let teams = [];
    let selected = null;
    let tab = 'dashboard';
    let liveMatchId = null;
    let liveData = null;
    let teamPlayers = [];

    const api = async (path, opt = {}) => {
      let r = await fetch('/api/' + path, {
        headers: {
          'content-type': 'application/json',
          ...(opt.headers || {})
        },
        ...opt
      });

      let j = r.status === 204 ? null : await r.json().catch(() => ({}));
      if (!r.ok) {
        throw Error(j?.error || 'API-fout ' + r.status);
      }
      return j;
    };

    const esc = x => String(x ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[c]));

    const canWrite = () => selected && ['Owner', 'Coach'].includes(selected.role);

    async function init() {
      let me = await fetch('/.auth/me').then(r => r.json()).catch(() => ({}));
      principal = me.clientPrincipal || null;
      renderAuth();
      if (principal) {
        await loadTeams();
      } else {
        renderLogin();
      }
    }

    function renderAuth() {
      document.querySelector('#auth').innerHTML = principal
        ? `<span>${esc(principal.userDetails || principal.userId || 'Gebruiker')}</span>
           <a class="btn btn2" href="/.auth/logout?post_logout_redirect_uri=/">Uitloggen</a>`
        : '';
    }

    function renderLogin() {
      document.querySelector('#app').innerHTML = `
        <section class="card">
          <h2>Welkom</h2>
          <p>Log in om VolleybalTeamManager te gebruiken.</p>
          <a class="btn" style="display:inline-block;text-decoration:none" href="/.auth/login/aad?post_login_redirect_uri=/">Inloggen</a>
        </section>
      `;
    }

    async function loadTeams() {
      selected = null;
      try {
        teams = await api('teams') || [];
        renderTeams();
      } catch (e) {
        document.querySelector('#app').innerHTML = `
          <div class="card">
            <h2>Kan teams niet laden</h2>
            <p>${esc(e.message || 'Onbekende fout')}</p>
          </div>
        `;
      }
    }

    function renderTeams() {
      document.querySelector('#app').innerHTML = `
        <section class="card">
          <div class="row">
            <div>
              <h2>Mijn teams</h2>
              <div class="muted">Selecteer een team.</div>
            </div>
            <button class="btn" onclick="newTeamForm()">Nieuw team</button>
          </div>
          <div class="grid">
            ${teams.map(t => `
              <article class="card team" onclick="openTeam('${t.teamId}')">
                <h3>${esc(t.teamName)}</h3>
                <span class="pill">${esc(t.role)}</span>
                <div class="muted">Seizoen ${esc(t.season || 'niet ingesteld')}</div>
              </article>
            `).join('') || '<p class="muted">Nog geen teams.</p>'}
          </div>
          <div id="form"></div>
        </section>
      `;
    }

    function newTeamForm() {
      document.querySelector('#form').innerHTML = `
        <div class="card">
          <h3>Nieuw team</h3>
          <div class="grid2">
            <input id="tn" class="input" placeholder="Teamnaam">
            <input id="ts" class="input" placeholder="Seizoen">
          </div>
          <div class="row">
            <button class="btn" onclick="createTeam()">Opslaan</button>
          </div>
        </div>
      `;
    }

    async function createTeam() {
      let teamName = document.querySelector('#tn').value.trim();
      let season = document.querySelector('#ts').value.trim();
      if (!teamName) return;
      await api('teams', {
        method: 'POST',
        body: JSON.stringify({ teamName, season })
      });
      await loadTeams();
    }

    async function openTeam(id) {
      selected = await api('teams/' + id);
      tab = 'dashboard';
      renderTeam();
    }

    async function editTeam() {
      let teamName = prompt('Teamnaam', selected.teamName);
      if (!teamName) return;
      let season = prompt('Seizoen', selected.season || '');
      await api('teams/' + selected.teamId, {
        method: 'PUT',
        body: JSON.stringify({ teamName, season })
      });
      selected = await api('teams/' + selected.teamId);
      renderTeam();
    }

    function nav() {
      return `
        <button class="btn menu-button" onclick="openMenu()" aria-label="Menu openen" aria-expanded="false">
          <span class="menu-icon">☰</span>
          <span>Menu</span>
        </button>
      `;
    }

    function menuHtml() {
      if (!selected) return '';
      const item = (key, label) => `
        <button class="btn btn2 ${tab === key ? 'menu-current' : ''}" onclick="menuNavigate('${key}')">${label}</button>
      `;
      return `
        <div id="menuOverlay" class="menu-overlay"></div>
        <div id="menuDrawer" class="menu-drawer">
          ${item('dashboard', 'Dashboard')}
          ${item('players', 'Spelers')}
          ${item('matches', 'Wedstrijden')}
          ${item('members', 'Teamleden')}
          ${item('report', 'Power BI')}
        </div>
      `;
    }

    function openMenu() {
      let o = document.querySelector('#menuOverlay');
      let d = document.querySelector('#menuDrawer');
      if (!o || !d) return;
      o.classList.add('open');
      d.classList.add('open');
      d.setAttribute('aria-hidden', 'false');
    }

    function closeMenu() {
      let o = document.querySelector('#menuOverlay');
      let d = document.querySelector('#menuDrawer');
      if (!o || !d) return;
      o.classList.remove('open');
      d.classList.remove('open');
      d.setAttribute('aria-hidden', 'true');
    }

    async function menuNavigate(target) {
      closeMenu();
      await showTab(target);
    }

    async function goToTeams() {
      closeMenu();
      await loadTeams();
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeMenu();
    });

    async function showTab(x) {
      tab = x;
      liveMatchId = null;
      renderTeam();
    }

    async function renderTeam() {
      document.querySelector('#app').innerHTML = `
        ${menuHtml()}
        <section class="card">
          <div class="team-toolbar row">
            <div>
              <h2>${esc(selected.teamName)}</h2>
              <span class="pill">${esc(selected.role)}</span>
            </div>
            <div class="row-actions">
              ${nav()}
              <button class="btn btn2" onclick="editTeam()">Bewerken</button>
              <button class="btn btn2" onclick="goToTeams()">Terug</button>
            </div>
          </div>

          <div class="tab-pane">
            <div id="dashboard"></div>
            <div id="players"></div>
            <div id="matches"></div>
            <div id="members"></div>
            <div id="report"></div>
          </div>
        </section>
      `;

      const sections = {
        dashboard,
        players,
        matches,
        members,
        report
      };

      for (const key of Object.keys(sections)) {
        const el = document.getElementById(key);
        if (el) {
          await sections[key](el);
        }
      }
    }

    async function dashboard(p) {
      let d = await api('dashboard?teamId=' + selected.teamId);
      p.innerHTML = `
        <h3>Dashboard</h3>
        <div class="grid">
          <div class="card">
            <div class="muted">Spelers</div>
            <div class="stat">${d.players}</div>
          </div>
          <div class="card">
            <div class="muted">Wedstrijden</div>
            <div class="stat">${d.matches}</div>
          </div>
          <div class="card">
            <div class="muted">Sets</div>
            <div class="stat">${d.sets}</div>
          </div>
        </div>
      `;
    }

    async function players(p) {
      let x = await api('players?teamId=' + selected.teamId);
      let stats = [];
      try {
        stats = await api('attendance/stats?teamId=' + selected.teamId) || [];
      } catch (e) {
        stats = [];
      }

      let statMap = new Map(stats.map(v => [v.playerId, v.player]));
      p.innerHTML = `
        <div class="row">
          <h3>Spelers</h3>
          ${canWrite() ? '<button class="btn" onclick="playerForm()">Speler toevoegen</button>' : ''}
        </div>
        <div class="grid">
          ${x.map(s => `
            <div class="card">
              <div class="row">
                <div>
                  <h3>${esc(s.name)}</h3>
                </div>
                <div class="row-actions">
                  <button class="btn btn2" onclick="editPlayer('${s.playerId}')">Bewerken</button>
                  ${canWrite() ? `<button class="btn danger" onclick="deletePlayer('${s.playerId}','${esc(s.name).replace(/'/g, \"\\\\'\")}')">Verwijderen</button>` : ''}
                </div>
              </div>
              <div class="muted">Rugnummer: ${esc(s.number || '')}</div>
              <div class="muted">Rol: ${esc(s.role || '')}</div>
            </div>
          `).join('') || '<p class="muted">Nog geen spelers.</p>'}
        </div>
        <div id="pform"></div>
      `;
    }

    function playerForm() {
      document.querySelector('#pform').innerHTML = `
        <div class="card">
          <h3>Nieuwe speler</h3>
          <div class="grid2">
            <input id="pn" class="input" placeholder="Naam">
            <input id="pno" class="input" placeholder="Rugnummer">
            <select id="pr" class="input">
              <option value="">Selecteer rol</option>
              <option value="Aanvaller">Aanvaller</option>
              <option value="Verdediger">Verdediger</option>
              <option value="Libero">Libero</option>
            </select>
          </div>
          <div class="row">
            <button class="btn" onclick="addPlayer()">Opslaan</button>
          </div>
        </div>
      `;
    }

    async function addPlayer() {
      let name = document.querySelector('#pn').value.trim();
      let number = document.querySelector('#pno').value.trim();
      let role = document.querySelector('#pr').value;
      if (!name) return;
      await api('players', {
        method: 'POST',
        body: JSON.stringify({ teamId: selected.teamId, name, number, role })
      });
      await players(document.getElementById('players'));
    }

    async function editPlayer(id) {
      let list = await api('players?teamId=' + selected.teamId);
      let v = list.find(x => x.playerId === id);
      if (!v) return;
      let name = prompt('Naam', v.name);
      if (!name) return;
      let number = prompt('Rugnummer', v.number || '');
      await api('players/' + id, {
        method: 'PUT',
        body: JSON.stringify({ teamId: selected.teamId, name, number, role: v.role || '' })
      });
      await players(document.getElementById('players'));
    }

    async function matches(p) {
      let x = await api('matches?teamId=' + selected.teamId);
      p.innerHTML = `
        <div class="row">
          <h3>Wedstrijden</h3>
          ${canWrite() ? '<button class="btn" onclick="matchForm()">Wedstrijd toevoegen</button>' : ''}
        </div>
        <div class="grid">
          ${x.map(m => `
            <div class="card">
              <div class="row">
                <div>
                  <h3>${esc(m.opponent)}</h3>
                </div>
                <div class="row-actions">
                  <button class="btn btn2" onclick="openLiveMatch('${m.matchId}','${m.status}')">Openen</button>
                </div>
              </div>
              <div class="muted">Datum: ${esc(m.matchDate || '')}</div>
              <div class="muted">Type: ${esc(m.matchType || 'Competition')}</div>
              <div class="muted">Status: ${esc(m.status || 'Planned')}</div>
            </div>
          `).join('') || '<p class="muted">Nog geen wedstrijden.</p>'}
        </div>
        <div id="mform"></div>
      `;
    }

    function matchForm() {
      document.querySelector('#mform').innerHTML = `
        <div class="card">
          <h3>Nieuwe wedstrijd</h3>
          <div class="grid2">
            <input id="mo" class="input" placeholder="Tegenstander">
            <input id="md" class="input" type="date">
            <select id="mt" class="input">
              <option value="Competition">Competition</option>
              <option value="Cup">Cup</option>
            </select>
          </div>
          <div class="row">
            <button class="btn" onclick="addMatch()">Opslaan</button>
          </div>
        </div>
      `;
    }

    async function addMatch() {
      let opponent = document.querySelector('#mo').value.trim();
      let matchDate = document.querySelector('#md').value;
      let matchType = document.querySelector('#mt').value;
      if (!opponent) return;
      await api('matches', {
        method: 'POST',
        body: JSON.stringify({ teamId: selected.teamId, opponent, matchDate, matchType })
      });
      await matches(document.getElementById('matches'));
    }

    async function deletePlayer(id, name) {
      if (!confirm(`Speler ${name} definitief verwijderen?`)) return;
      try {
        await api('management-v2/player', {
          method: 'POST',
          body: JSON.stringify({ teamId: selected.teamId, playerId: id })
        });
      } catch (e) {
        alert(e.message || 'Verwijderen mislukt.');
      }
      await players(document.getElementById('players'));
    }

    async function deleteMatch(id, opponent) {
      if (!confirm(`Wedstrijd tegen ${opponent} definitief verwijderen?`)) return;
      try {
        await api('management-v2/match', {
          method: 'POST',
          body: JSON.stringify({ teamId: selected.teamId, matchId: id })
        });
      } catch (e) {
        alert(e.message || 'Verwijderen mislukt.');
      }
      await matches(document.getElementById('matches'));
    }

    async function deleteMember(userId, email) {
      if (!confirm(`Coach ${email || ''} uit dit team verwijderen?`)) return;
      try {
        await api('management-v2/member', {
          method: 'POST',
          body: JSON.stringify({ teamId: selected.teamId, userId })
        });
      } catch (e) {
        alert(e.message || 'Verwijderen mislukt.');
      }
      await members(document.getElementById('members'));
    }

    async function deleteInvitation(email) {
      if (!confirm(`Uitnodiging voor ${email} annuleren?`)) return;
      try {
        await api('invitations', {
          method: 'DELETE',
          body: JSON.stringify({ teamId: selected.teamId, email })
        });
      } catch (e) {
        alert(e.message || 'Uitnodiging annuleren is mislukt.');
      }
      await members(document.getElementById('members'));
    }

    async function members(p) {
      let x = await api('members?teamId=' + selected.teamId);
      let invites = [];
      let invitationError = '';
      
      if (selected.role === 'Owner') {
        try {
          invites = await api('invitations?teamId=' + selected.teamId) || [];
        } catch (e) {
          invitationError = e.message || 'Uitnodigingen konden niet worden geladen.';
        }
      }

const invitesHtml = selected.role === 'Owner'
  ? `<div class="row"><h3>Openstaande uitnodigingen</h3></div>
     ${invitationError
       ? `<p class="muted">Fout bij laden van uitnodigingen: ${esc(invitationError)}</p>`
       : invites.length
         ? invites.map(inv => `
             <div class="row">
               <div>${esc(inv.email)}</div>
               <div class="row-actions">
                 <span class="pill">${esc(inv.role || 'Viewer')}</span>
                 <button class="btn danger" onclick="deleteInvitation('${String(inv.email || '').replace(/\\\\/g, '\\\\\\\\').replace(/'/g, \"\\\\'\")}')">Annuleren</button>
               </div>
             </div>
              `).join('')
                       : '<p class="muted">Geen openstaande uitnodigingen.</p>'}`
                : '';

      p.innerHTML = `
        <div class="row">
          <h3>Teamleden</h3>
          ${selected.role === 'Owner' ? '<button class="btn" onclick="inviteForm()">Uitnodigen</button>' : ''}
        </div>
        ${x.map(m => `
          <div class="row">
            <div>${esc(m.email)}</div>
            <div class="row-actions">
              <span class="pill">${esc(m.role)}</span>
              ${selected.role === 'Owner' && m.role !== 'Owner' && m.memberId ? `<button class="btn danger" onclick="deleteMember('${m.memberId}','${esc(m.email).replace(/'/g, \"\\\\'\")}')">Verwijderen</button>` : ''}
            </div>
          </div>
        `).join('')}
        ${invitesHtml}
        <div id="iform"></div>
      `;
    }

    function inviteForm() {
      document.querySelector('#iform').innerHTML = `
        <div class="card">
          <h3>Uitnodiging versturen</h3>
          <div class="grid2">
            <input id="ie" class="input" type="email" placeholder="E-mailadres">
            <select id="ir" class="input">
              <option value="Coach">Coach</option>
              <option value="Viewer">Viewer</option>
            </select>
          </div>
          <div class="row">
            <button class="btn" onclick="invite()">Uitnodiging versturen</button>
          </div>
        </div>
      `;
    }

    async function invite() {
      await api('invitations', {
        method: 'POST',
        body: JSON.stringify({
          teamId: selected.teamId,
          email: document.querySelector('#ie').value,
          role: document.querySelector('#ir').value
        })
      });
      await members(document.getElementById('members'));
    }

    function report(p) {
      p.innerHTML = `
        <h3>Power BI-export</h3>
        <p>Open de genormaliseerde teamgegevens.</p>
        <a class="btn" style="display:inline-block;text-decoration:none" href="/api/report-phase2?teamId=${selected.teamId}" target="_blank" rel="noreferrer">Open export</a>
      `;
    }

    init();
  </script>
</body>
</html>
