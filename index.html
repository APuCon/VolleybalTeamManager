<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142138"><link rel="manifest" href="/manifest.webmanifest"><title>VolleybalTeamManager V3</title><style>
:root{--n:#142138;--p:#1c2c49;--l:#26395d;--t:#edf1f8;--d:#9ca8bd;--o:#ed9a3b;--r:#c45d50;--g:#65b781}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#172944,var(--n));color:var(--t);font:14px Segoe UI,Arial;min-height:100vh}button,input,select{font:inherit}.shell{max-width:1040px;margin:auto;padding:18px}.top,.row,.court-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:23px;font-weight:800}.muted{color:var(--d);font-size:12px}.card{background:var(--p);border:1px solid #ffffff12;border-radius:14px;padding:17px;margin-top:14px}.btn{border:0;border-radius:8px;padding:10px 13px;font-weight:700;background:var(--o);color:#241607;cursor:pointer}.btn2{background:var(--l);color:var(--t);border:1px solid #ffffff20}.danger{background:#c45d5030;color:#ffd3cd;border:1px solid #c45d5070}.success{background:var(--g);color:#082015}.input{width:100%;padding:10px;background:var(--l);border:1px solid #ffffff18;color:var(--t);border-radius:8px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.grid2,.lineup-grid,.point-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.team{cursor:pointer}.team:hover{border-color:var(--o)}.nav,.live-tabs{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.nav button,.live-tabs button{flex:1;min-width:100px}.pill{display:inline-block;padding:3px 7px;border-radius:20px;background:#ffffff12;font-size:11px}.row{padding:10px 0;border-bottom:1px solid #ffffff10}.row-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.stat{font-size:25px;font-weight:800}.auth{display:flex;align-items:center;gap:8px}.scoreboard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:12px;padding:18px 0}.score-num{font-size:54px;font-weight:800;line-height:1}.score-us{color:var(--o)}.score-opp{color:var(--r)}.set-tally{font-size:25px;font-weight:800}.point-grid .btn{font-size:16px;padding:16px}.set-list{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.set-chip{background:var(--l);padding:8px 10px;border-radius:8px}.history{max-height:270px;overflow:auto}.sub-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sub-entry{border-left:3px solid var(--o);padding-left:10px}.attendance-row{display:grid;grid-template-columns:minmax(160px,1fr) 150px minmax(150px,1fr);gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #ffffff10}.mini-stats{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}.court{background:#efa779;border:2px solid #ffd0b1;border-radius:10px;padding:8px;margin-top:10px}.net{text-align:center;color:#142138;border-bottom:3px solid #142138;padding:5px;font-weight:800}.courtgrid{position:relative;height:330px}.court-player{position:absolute;transform:translate(-50%,-50%);width:22%;min-width:70px;max-width:110px;background:#142138;color:#fff;border:2px solid #ffffff33;border-radius:9px;padding:5px;text-align:center;box-shadow:0 3px 9px #0005}.court-player.server{border-color:var(--o);box-shadow:0 0 0 2px #ed9a3b55,0 3px 9px #0005}.court-role{font-size:10px;color:var(--o)}.court-pos{font-size:10px;color:#cfd6e4}.court-name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.court-number{display:inline-block;margin-top:3px;padding:1px 5px;border-radius:999px;background:#edf1f8;color:#142138;font-size:11px;font-weight:900}label{display:block;color:var(--d);font-size:11px;margin:10px 0 4px}h2,h3{margin:0 0 8px}@media(max-width:720px){.grid,.grid2,.lineup-grid,.point-grid{grid-template-columns:1fr}.top{align-items:flex-start}.auth{flex-wrap:wrap;justify-content:flex-end}.row{align-items:flex-start}.score-num{font-size:42px}.courtgrid{height:300px}.court-player{width:27%;min-width:64px;font-size:11px}}
</style></head><body><div class="shell"><header class="top"><div><div class="brand">VolleybalTeamManager</div><div class="muted">Teams, spelers, wedstrijden, live score en rotaties</div></div><div id="auth" class="auth"></div></header><main id="app"><div class="card">Laden...</div></main></div><script>
let principal=null,teams=[],selected=null,tab='dashboard',liveMatchId=null,liveData=null,teamPlayers=[];
const api=async(path,opt={})=>{let r=await fetch('/api/'+path,{headers:{'content-type':'application/json',...(opt.headers||{})},...opt}),j=r.status===204?null:await r.json().catch(()=>({}));if(!r.ok)throw Error(j?.error||'API-fout '+r.status);return j};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const canWrite=()=>selected&&['Owner','Coach'].includes(selected.role);
async function init(){let me=await fetch('/.auth/me').then(r=>r.json()).catch(()=>({}));principal=me.clientPrincipal||null;renderAuth();principal?await loadTeams():renderLogin()}
function renderAuth(){document.querySelector('#auth').innerHTML=principal?`<span>${esc(principal.userDetails)}</span><a class="btn btn2" href="/.auth/logout?post_logout_redirect_uri=/">Uitloggen</a>`:`<a class="btn" href="/.auth/login/aad?post_login_redirect_uri=/">Inloggen</a>`}
function renderLogin(){document.querySelector('#app').innerHTML=`<section class="card"><h2>Welkom</h2><p>Log in om VolleybalTeamManager te gebruiken.</p><a class="btn" style="display:inline-block;text-decoration:none" href="/.auth/login/aad?post_login_redirect_uri=/">Inloggen / registreren</a></section>`}
async function loadTeams(){selected=null;try{teams=await api('teams')||[];renderTeams()}catch(e){document.querySelector('#app').innerHTML=`<div class="card"><h2>Kan teams niet laden</h2><p>${esc(e.message)}</p></div>`}}
function renderTeams(){document.querySelector('#app').innerHTML=`<section class="card"><div class="row"><div><h2>Mijn teams</h2><div class="muted">Selecteer een team.</div></div><button class="btn" onclick="newTeamForm()">Nieuw team</button></div><div class="grid">${teams.map(t=>`<article class="card team" onclick="openTeam('${t.teamId}')"><h3>${esc(t.teamName)}</h3><span class="pill">${esc(t.role)}</span><div class="muted">Seizoen ${esc(t.season||'niet ingesteld')}</div></article>`).join('')||'<p class="muted">Nog geen teams.</p>'}</div><div id="form"></div></section>`}
function newTeamForm(){document.querySelector('#form').innerHTML=`<div class="card"><h3>Nieuw team</h3><div class="grid2"><input id="tn" class="input" placeholder="Teamnaam"><input id="ts" class="input" placeholder="2026-2027"></div><button class="btn" onclick="createTeam()">Aanmaken</button></div>`}
async function createTeam(){let teamName=document.querySelector('#tn').value.trim(),season=document.querySelector('#ts').value.trim();if(!teamName)return;await api('teams',{method:'POST',body:JSON.stringify({teamName,season})});await loadTeams()}
async function openTeam(id){selected=await api('teams/'+id);tab='dashboard';renderTeam()}
async function editTeam(){let teamName=prompt('Teamnaam',selected.teamName);if(!teamName)return;let season=prompt('Seizoen',selected.season||'');await api('teams/'+selected.teamId,{method:'PUT',body:JSON.stringify({teamName,season})});selected.teamName=teamName;selected.season=season;renderTeam()}
function nav(){return`<div class="nav"><button class="btn btn2" onclick="showTab('dashboard')">Dashboard</button><button class="btn btn2" onclick="showTab('players')">Spelers</button><button class="btn btn2" onclick="showTab('matches')">Wedstrijden</button><button class="btn btn2" onclick="showTab('members')">Coaches</button><button class="btn btn2" onclick="showTab('report')">Power BI export</button></div>`}
async function showTab(x){tab=x;liveMatchId=null;renderTeam()}
async function renderTeam(){document.querySelector('#app').innerHTML=`<button class="btn btn2" onclick="loadTeams()">← Mijn teams</button><section class="card"><div class="row"><div><h2>${esc(selected.teamName)}</h2><span class="pill">${esc(selected.role)}</span> ${selected.role==='Owner'?'<button class="btn btn2" onclick="editTeam()">Team wijzigen</button>':''}</div><div class="muted">${esc(selected.season)}</div></div>${nav()}<div id="pane" class="card">Laden...</div></section>`;let p=document.querySelector('#pane');try{if(tab==='dashboard')await dashboard(p);if(tab==='players')await players(p);if(tab==='matches')await matches(p);if(tab==='members')await members(p);if(tab==='report')report(p)}catch(e){p.innerHTML=`<h3>Er ging iets mis</h3><p>${esc(e.message)}</p>`}}
async function dashboard(p){let d=await api('dashboard?teamId='+selected.teamId);p.innerHTML=`<h3>Dashboard</h3><div class="grid"><div class="card"><div class="muted">Spelers</div><div class="stat">${d.players}</div></div><div class="card"><div class="muted">Wedstrijden</div><div class="stat">${d.matches}</div></div><div class="card"><div class="muted">Sets</div><div class="stat">${d.sets}</div></div></div>`}
async function players(p){let x=await api('players?teamId='+selected.teamId),stats=[];try{stats=await api('attendance/stats?teamId='+selected.teamId)}catch{}let statMap=new Map(stats.map(v=>[v.playerId,v]));p.innerHTML=`<div class="row"><h3>Spelers</h3>${canWrite()?'<button class="btn" onclick="playerForm()">Speler toevoegen</button>':''}</div>${x.map(v=>`<div class="row"><div><b>${esc(v.name)}</b><div class="muted">#${esc(v.number)} · ${esc(v.role)}</div><div class="mini-stats">${(()=>{let q=statMap.get(v.playerId);return q?`<span class="pill">${q.setsPlayed} sets gespeeld</span><span class="pill">${q.setsBench} sets reserve</span><span class="pill">${q.matchesAbsent}× afwezig</span>`:''})()}</div></div><div class="row-actions"><span class="pill">${v.active?'Actief':'Inactief'}</span>${canWrite()?`<button class="btn btn2" onclick="editPlayer('${v.playerId}')">Bewerken</button>`:''}</div></div>`).join('')||'<p class="muted">Geen spelers.</p>'}<div id="pform"></div>`}
function playerForm(){document.querySelector('#pform').innerHTML=`<div class="card grid"><input id="pn" class="input" placeholder="Naam"><input id="pno" class="input" placeholder="Rugnummer"><select id="pr" class="input"><option>Setter</option><option>Diagonaal</option><option>Midden</option><option>Buiten</option><option>Libero</option></select><button class="btn" onclick="addPlayer()">Opslaan</button></div>`}
async function addPlayer(){await api('players',{method:'POST',body:JSON.stringify({teamId:selected.teamId,name:document.querySelector('#pn').value,number:document.querySelector('#pno').value,role:document.querySelector('#pr').value})});players(document.querySelector('#pane'))}
async function editPlayer(id){let list=await api('players?teamId='+selected.teamId),v=list.find(x=>x.playerId===id),name=prompt('Naam',v.name);if(!name)return;let number=prompt('Rugnummer',v.number||'');await api('players/'+id,{method:'PUT',body:JSON.stringify({teamId:selected.teamId,name,number,role:v.role})});players(document.querySelector('#pane'))}
async function matches(p){let x=await api('matches?teamId='+selected.teamId);p.innerHTML=`<div class="row"><h3>Wedstrijden</h3>${canWrite()?'<button class="btn" onclick="matchForm()">Wedstrijd toevoegen</button>':''}</div>${x.map(m=>`<div class="row"><div><b>${esc(m.opponent)}</b><div class="muted">${esc(m.matchDate)} · ${esc(m.location)}</div></div><div class="row-actions"><span class="pill">${esc(m.status)}</span><button class="btn ${m.status==='Completed'?'btn2':''}" onclick="openLiveMatch('${m.matchId}','${esc(m.status)}')">${m.status==='Planned'?'Start scoreregistratie':'Open wedstrijd'}</button></div></div>`).join('')||'<p class="muted">Geen wedstrijden.</p>'}<div id="mform"></div>`}
function matchForm(){document.querySelector('#mform').innerHTML=`<div class="card grid"><input id="mo" class="input" placeholder="Tegenstander"><input id="md" class="input" type="date"><input id="ml" class="input" placeholder="Locatie"><button class="btn" onclick="addMatch()">Opslaan</button></div>`}
async function addMatch(){await api('matches',{method:'POST',body:JSON.stringify({teamId:selected.teamId,opponent:document.querySelector('#mo').value,matchDate:document.querySelector('#md').value,location:document.querySelector('#ml').value})});matches(document.querySelector('#pane'))}
const ROLES=['setter','buiten1','midden1','dia','buiten2','midden2'],LABEL={setter:'Setter',buiten1:'Buiten 1',midden1:'Midden 1',dia:'Diagonaal',buiten2:'Buiten 2',midden2:'Midden 2'};
const VISUAL={team:{1:{setter:[81,88],buiten1:[80,26],midden1:[49,26],dia:[17,26],buiten2:[17,88],midden2:[49,88]},2:{setter:[49,88],buiten1:[88,88],midden1:[81,26],dia:[49,26],buiten2:[18,26],midden2:[18,88]},3:{setter:[18,88],buiten1:[49,88],midden1:[81,88],dia:[81,26],buiten2:[49,26],midden2:[18,26]},4:{setter:[20,26],buiten1:[20,77],midden1:[49,77],dia:[76,77],buiten2:[76,26],midden2:[49,26]},5:{setter:[49,26],buiten1:[20,26],midden1:[20,77],dia:[49,77],buiten2:[74,77],midden2:[74,26]},6:{setter:[76,26],buiten1:[49,26],midden1:[20,26],dia:[20,77],buiten2:[49,77],midden2:[76,77]}},opponent:{1:{setter:[89,88],buiten1:[80,83],midden1:[49,26],dia:[24,40],buiten2:[17,88],midden2:[49,88]},2:{setter:[62,26],buiten1:[74,68],midden1:[81,44],dia:[68,15],buiten2:[20,66],midden2:[56,83]},3:{setter:[44,37],buiten1:[49,88],midden1:[76,77],dia:[81,26],buiten2:[26,74],midden2:[18,26]},4:{setter:[6,9],buiten1:[20,77],midden1:[66,76],dia:[82,88],buiten2:[48,77],midden2:[7,20]},5:{setter:[55,28],buiten1:[27,67],midden1:[49,75],dia:[59,89],buiten2:[68,72],midden2:[75,39]},6:{setter:[69,11],buiten1:[13,66],midden1:[7,26],dia:[26,89],buiten2:[49,77],midden2:[76,77]}}};
async function openLiveMatch(id,status){liveMatchId=id;let p=document.querySelector('#pane');p.innerHTML='<p>Wedstrijd laden...</p>';try{if(status==='Planned'&&canWrite())await api('live/start',{method:'POST',body:JSON.stringify({teamId:selected.teamId,matchId:id})});liveData=await api('phase2/status?teamId='+selected.teamId+'&matchId='+id);teamPlayers=await api('players?teamId='+selected.teamId);renderLive(p)}catch(e){p.innerHTML=`<h3>Kan wedstrijd niet openen</h3><p>${esc(e.message)}</p><button class="btn btn2" onclick="showTab('matches')">Terug</button>`}}
function renderLive(p=document.querySelector('#pane')){p.innerHTML=`<div class="row"><div><h3>${esc(selected.teamName)} tegen ${esc(liveData.match.opponent)}</h3><div class="muted">${esc(liveData.match.matchDate)} · ${esc(liveData.match.location)}</div></div><button class="btn btn2" onclick="showTab('matches')">Terug naar wedstrijden</button></div><div class="live-tabs"><button class="btn btn2" onclick="showLiveScore()">Score</button><button class="btn btn2" onclick="showLineup()">Opstelling en veld</button><button class="btn btn2" onclick="showSubstitutions()">Wissels</button><button class="btn btn2" onclick="showAttendance()">Aanwezigheid</button></div><div id="livebody"></div>`;showLiveScore()}
function showLiveScore(){let p=document.querySelector('#livebody'),d=liveData,m=d.match,s=d.currentSet,ln=d.lineup,done=d.teamSets>=3||d.opponentSets>=3,ro=m.status==='Completed'||!canWrite();if(!ln&&!ro){p.innerHTML='<div class="card"><h3>Opstelling vereist</h3><p>Sla eerst de opstelling op.</p><button class="btn" onclick="showLineup()">Opstelling invullen</button></div>';return}p.innerHTML=`<div class="scoreboard"><div><div>${esc(selected.teamName)}</div><div class="score-num score-us">${s?.teamScore||0}</div></div><div><div class="set-tally">${d.teamSets} - ${d.opponentSets}</div><div class="muted">Set ${s?.setNumber||''}${ln?' · rotatie '+ln.rotation:''}</div><div class="muted">${ln?(ln.serving==='team'?esc(selected.teamName):esc(m.opponent))+' serveert':''}</div></div><div><div>${esc(m.opponent)}</div><div class="score-num score-opp">${s?.opponentScore||0}</div></div></div>${!ro&&s&&!s.completed?`<div class="point-grid"><button class="btn" onclick="addPoint('team')">Punt voor ${esc(selected.teamName)}</button><button class="btn danger" onclick="addPoint('opponent')">Punt voor ${esc(m.opponent)}</button></div><button class="btn btn2" onclick="undoPoint()">Laatste punt ongedaan maken</button>`:''}${!ro&&s?.completed&&!done?'<button class="btn success" onclick="nextSet()">Volgende set starten</button>':''}${!ro&&done?'<button class="btn success" onclick="finishMatch()">Wedstrijd afronden</button>':''}<div class="set-list">${d.sets.map(x=>`<div class="set-chip">Set ${x.setNumber}: <b>${x.teamScore}-${x.opponentScore}</b>${x.completed?' ✓':''}</div>`).join('')}</div><div class="card history"><h3>Puntenhistorie huidige set</h3>${[...d.points].reverse().map(x=>`<div class="row"><span>${x.winner==='team'?esc(selected.teamName):esc(m.opponent)}</span><b>${x.teamScore}-${x.opponentScore}</b></div>`).join('')||'<p class="muted">Nog geen punten.</p>'}</div>${ln?courtHtml(ln):''}`}
function options(id=''){return '<option value="">Selecteer speler</option>'+teamPlayers.filter(x=>x.active!==false&&(!window.matchPresentIds||window.matchPresentIds.size===0||window.matchPresentIds.has(x.playerId))).map(x=>`<option value="${x.playerId}" ${x.playerId===id?'selected':''}>#${esc(x.number)} ${esc(x.name)}</option>`).join('')}
async function showLineup(){let p=document.querySelector('#livebody'),d=liveData,s=d.currentSet,ln=d.lineup;if(!s){p.innerHTML='<p>Geen actieve set.</p>';return}let dis=d.match.status==='Completed'?'disabled':'',attendance=[];try{attendance=await api('attendance?teamId='+selected.teamId+'&matchId='+liveMatchId)}catch{}let presentIds=new Set(attendance.filter(x=>x.status==='Present').map(x=>x.playerId));window.matchPresentIds=presentIds;p.innerHTML=`<div class="card"><h3>Opstelling set ${s.setNumber}</h3><div class="lineup-grid">${ROLES.map(r=>`<div><label>${LABEL[r]}</label><select ${dis} class="input lineup-player" data-role="${r}">${options(ln?.players?.[r]?.playerId||'')}</select></div>`).join('')}</div><div class="grid2"><div><label>Wie start op positie 1?</label><select ${dis} id="startRole" class="input">${ROLES.map(r=>`<option value="${r}" ${ln?.startRole===r?'selected':''}>${LABEL[r]}</option>`).join('')}</select></div><div><label>Eerste service</label><select ${dis} id="initialServer" class="input"><option value="team" ${ln?.initialServer==='team'?'selected':''}>${esc(selected.teamName)}</option><option value="opponent" ${ln?.initialServer==='opponent'?'selected':''}>${esc(d.match.opponent)}</option></select></div></div>${dis?'':'<button class="btn" onclick="saveLineup()">Opstelling opslaan</button>'}</div>${ln?courtHtml(ln):'<p class="muted">Na opslaan verschijnt het veld.</p>'}`}
async function showAttendance(){let p=document.querySelector('#livebody'),rows=[];try{rows=await api('attendance?teamId='+selected.teamId+'&matchId='+liveMatchId)}catch(e){p.innerHTML=`<p>${esc(e.message)}</p>`;return}p.innerHTML=`<div class="card"><div class="row"><div><h3>Aanwezigheid wedstrijd</h3><div class="muted">Leg vóór de opstelling vast wie aanwezig en afwezig is.</div></div>${canWrite()&&liveData.match.status!=='Completed'?'<button class="btn" onclick="saveAttendance()">Aanwezigheid opslaan</button>':''}</div><div id="attendanceList">${rows.map(x=>`<div class="attendance-row"><div><b>#${esc(x.number)} ${esc(x.name)}</b><div class="muted">${esc(x.role)}</div></div><select class="input attendance-status" data-player="${x.playerId}" ${!canWrite()?'disabled':''}><option value="Unknown" ${x.status==='Unknown'?'selected':''}>Nog niet vastgelegd</option><option value="Present" ${x.status==='Present'?'selected':''}>Aanwezig</option><option value="Absent" ${x.status==='Absent'?'selected':''}>Afwezig</option></select><input class="input attendance-note" data-player="${x.playerId}" value="${esc(x.note||'')}" placeholder="Opmerking" ${!canWrite()?'disabled':''}></div>`).join('')}</div></div>`}
async function saveAttendance(){let players=[...document.querySelectorAll('.attendance-status')].map(x=>({playerId:x.dataset.player,status:x.value,note:document.querySelector(`.attendance-note[data-player="${x.dataset.player}"]`)?.value||''}));if(players.some(x=>x.status==='Unknown')){alert('Geef voor iedere speler aan of de speler aanwezig of afwezig is.');return}try{await api('attendance',{method:'POST',body:JSON.stringify({teamId:selected.teamId,matchId:liveMatchId,players})});alert('Aanwezigheid opgeslagen.');await showAttendance()}catch(e){alert(e.message)}}
async function showSubstitutions(){let p=document.querySelector('#livebody'),d=liveData,ln=d.lineup,s=d.currentSet;if(!ln||!s){p.innerHTML='<p>Sla eerst de opstelling op.</p>';return}let active=new Set(ROLES.map(r=>ln.players[r]?.playerId).filter(Boolean)),reserves=teamPlayers.filter(x=>x.active!==false&&!active.has(x.playerId)),history=[];try{history=await api('substitutions?teamId='+selected.teamId+'&matchId='+liveMatchId+'&setNumber='+s.setNumber)}catch(e){p.innerHTML=`<p>${esc(e.message)}</p>`;return}let roleOptions=ROLES.map(r=>`<option value="${r}">${LABEL[r]} · #${esc(ln.players[r]?.number||'—')} ${esc(ln.players[r]?.name||'—')}</option>`).join(''),reserveOptions=reserves.map(x=>`<option value="${x.playerId}">#${esc(x.number)} ${esc(x.name)} · ${esc(x.role)}</option>`).join('');p.innerHTML=`<div class="card"><h3>Wissel toepassen · set ${s.setNumber}</h3><div class="sub-grid"><div><label>Speler uit het veld</label><select id="subRole" class="input">${roleOptions}</select></div><div><label>Speler in het veld</label><select id="subIn" class="input">${reserveOptions||'<option value="">Geen reserves beschikbaar</option>'}</select></div></div>${canWrite()&&d.match.status!=='Completed'?'<button class="btn" onclick="applySubstitution()">Wissel toepassen</button>':''}</div><div class="card"><div class="row"><h3>Wisselhistorie</h3>${canWrite()&&history.length?'<button class="btn btn2" onclick="undoSubstitution()">Laatste wissel terugdraaien</button>':''}</div>${history.slice().reverse().map(x=>`<div class="row sub-entry"><div><b>${LABEL[x.role]||esc(x.role)}</b><div class="muted">Uit: #${esc(x.outPlayerNumber)} ${esc(x.outPlayerName)}<br>In: #${esc(x.inPlayerNumber)} ${esc(x.inPlayerName)}<br>Bij stand ${x.teamScore}-${x.opponentScore} · rotatie ${x.rotation||'—'} · ${new Date(x.createdAt).toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'})}</div></div><span class="pill">Set ${x.setNumber}</span></div>`).join('')||'<p class="muted">Nog geen wissels in deze set.</p>'}</div>${courtHtml(ln)}`}
async function applySubstitution(){let role=document.querySelector('#subRole').value,inPlayerId=document.querySelector('#subIn').value;if(!inPlayerId){alert('Kies een reservespeler.');return}try{await api('substitutions',{method:'POST',body:JSON.stringify({teamId:selected.teamId,matchId:liveMatchId,setNumber:liveData.currentSet.setNumber,role,inPlayerId})});liveData=await api('phase2/status?teamId='+selected.teamId+'&matchId='+liveMatchId);await showSubstitutions()}catch(e){alert(e.message)}}
async function undoSubstitution(){try{await api('substitutions/undo',{method:'POST',body:JSON.stringify({teamId:selected.teamId,matchId:liveMatchId,setNumber:liveData.currentSet.setNumber})});liveData=await api('phase2/status?teamId='+selected.teamId+'&matchId='+liveMatchId);await showSubstitutions()}catch(e){alert(e.message)}}
function courtHtml(ln){let mode=ln.serving==='team'?'team':'opponent',layout=VISUAL[mode][Number(ln.rotation||1)],map={};ROLES.forEach((r,i)=>map[r]=((i-Number(ln.rotation||1)+1+6)%6)+1);return`<div class="card"><div class="court-head"><h3>Actuele veldopstelling</h3><span class="pill">Rotatie ${ln.rotation} · ${ln.serving==='team'?esc(selected.teamName):esc(liveData.match.opponent)} serveert</span></div><div class="court"><div class="net">NET</div><div class="courtgrid">${ROLES.map(r=>{let xy=layout[r],v=ln.players[r]||{},pos=map[r],server=ln.serving==='team'&&pos===1;return`<div class="court-player${server?' server':''}" style="left:${xy[0]}%;top:${xy[1]}%"><div class="court-pos">P${pos}${server?' · SERVICE':''}</div><div class="court-role">${LABEL[r]}</div><div class="court-name">${esc(v.name||'—')}</div><div class="court-number">#${esc(v.number||'—')}</div></div>`}).join('')}</div></div></div>`}
async function saveLineup(){let players={};document.querySelectorAll('.lineup-player').forEach(x=>players[x.dataset.role]={playerId:x.value});try{liveData=await api('lineup/save',{method:'POST',body:JSON.stringify({teamId:selected.teamId,matchId:liveMatchId,setNumber:liveData.currentSet.setNumber,players,startRole:document.querySelector('#startRole').value,initialServer:document.querySelector('#initialServer').value})});renderLive()}catch(e){alert(e.message)}}
async function phase2Action(path,body={}){try{liveData=await api(path,{method:'POST',body:JSON.stringify({teamId:selected.teamId,matchId:liveMatchId,...body})});renderLive()}catch(e){alert(e.message)}}
const addPoint=w=>phase2Action('phase2/point',{winner:w}),undoPoint=()=>phase2Action('phase2/undo');
async function nextSet(){await api('live/next-set',{method:'POST',body:JSON.stringify({teamId:selected.teamId,matchId:liveMatchId})});liveData=await api('phase2/status?teamId='+selected.teamId+'&matchId='+liveMatchId);renderLive()}
async function finishMatch(){await api('live/finish',{method:'POST',body:JSON.stringify({teamId:selected.teamId,matchId:liveMatchId})});liveData=await api('phase2/status?teamId='+selected.teamId+'&matchId='+liveMatchId);renderLive()}
async function members(p){let x=await api('members?teamId='+selected.teamId);p.innerHTML=`<div class="row"><h3>Teamleden</h3>${selected.role==='Owner'?'<button class="btn" onclick="inviteForm()">Uitnodigen</button>':''}</div>${x.map(m=>`<div class="row"><div>${esc(m.email)}</div><span class="pill">${esc(m.role)}</span></div>`).join('')}<div id="iform"></div>`}
function inviteForm(){document.querySelector('#iform').innerHTML=`<div class="card grid2"><input id="ie" class="input" type="email" placeholder="E-mailadres"><select id="ir" class="input"><option>Coach</option><option>Viewer</option></select><button class="btn" onclick="invite()">Uitnodiging vastleggen</button></div>`}
async function invite(){await api('invitations',{method:'POST',body:JSON.stringify({teamId:selected.teamId,email:document.querySelector('#ie').value,role:document.querySelector('#ir').value})});alert('Uitnodiging vastgelegd.');members(document.querySelector('#pane'))}
function report(p){p.innerHTML=`<h3>Power BI-export</h3><p>Open de genormaliseerde teamgegevens.</p><a class="btn" style="display:inline-block;text-decoration:none" href="/api/report-phase2?teamId=${selected.teamId}" target="_blank">Rapportagegegevens openen</a>`}
init();</script></body></html>
