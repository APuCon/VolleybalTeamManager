<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142138"><link rel="manifest" href="/manifest.webmanifest"><title>VolleybalTeamManager</title><style>
:root{--n:#142138;--p:#1c2c49;--l:#26395d;--t:#edf1f8;--d:#9ca8bd;--o:#ed9a3b;--r:#c45d50;--g:#65b781}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#172944,var(--n));color:var(--t);font:14px Segoe UI,Arial;min-height:100vh}button,input,select{font:inherit}.shell{max-width:1040px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:23px;font-weight:800}.muted{color:var(--d);font-size:12px}.card{background:var(--p);border:1px solid #ffffff12;border-radius:14px;padding:17px;margin-top:14px}.btn{border:0;border-radius:8px;padding:10px 13px;font-weight:700;background:var(--o);color:#241607;cursor:pointer}.btn2{background:var(--l);color:var(--t);border:1px solid #ffffff20}.danger{background:#c45d5030;color:#ffd3cd}.input{width:100%;padding:10px;background:var(--l);border:1px solid #ffffff18;color:var(--t);border-radius:8px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.team{cursor:pointer}.team:hover{border-color:var(--o)}.nav{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.nav button{flex:1;min-width:100px}.pill{display:inline-block;padding:3px 7px;border-radius:20px;background:#ffffff12;font-size:11px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #ffffff10}.stat{font-size:25px;font-weight:800}.row-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.scoreboard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:12px;padding:18px 0}.score-num{font-size:54px;font-weight:800;line-height:1}.score-us{color:var(--o)}.score-opp{color:var(--r)}.set-tally{font-size:25px;font-weight:800}.point-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.point-grid .btn{font-size:16px;padding:16px}.set-list{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.set-chip{background:var(--l);padding:8px 10px;border-radius:8px}.history{max-height:270px;overflow:auto}.live-tabs{display:flex;gap:8px;margin:14px 0}.live-tabs button{flex:1}.court{background:#d99162;border:2px solid #f4c3a2;border-radius:10px;padding:8px}.net{text-align:center;border-bottom:3px solid #142138;padding-bottom:5px;color:#142138;font-weight:800}.courtgrid{position:relative;height:330px}.court-player{position:absolute;transform:translate(-50%,-50%);background:#142138;color:#fff;border-radius:8px;padding:5px;width:22%;min-width:70px;max-width:105px;text-align:center;box-shadow:0 2px 8px #0005}.court-role{font-size:10px;color:#ed9a3b}.lineup-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.auth{display:flex;align-items:center;gap:8px}.hidden{display:none}label{display:block;color:var(--d);font-size:11px;margin:10px 0 4px}h2,h3{margin:0 0 8px}@media(max-width:720px){.grid,.grid2{grid-template-columns:1fr}.top{align-items:flex-start}.auth{flex-wrap:wrap;justify-content:flex-end}}</style></head><body><div class="shell"><header class="top"><div><div class="brand">VolleybalTeamManager</div><div class="muted">Teams, spelers, wedstrijden en rapportage</div></div><div id="auth" class="auth"></div></header><main id="app"><div class="card">Laden...</div></main></div><script>
let principal=null,teams=[],selected=null,tab='dashboard',liveMatchId=null,liveData=null,teamPlayers=[];const api=async(path,opt={})=>{let r=await fetch('/api/'+path,{headers:{'content-type':'application/json',...(opt.headers||{})},...opt});if(r.status===204)return null;let j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'API-fout '+r.status);return j};const esc=x=>String(x||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function init(){let me=await fetch('/.auth/me').then(r=>r.json()).catch(()=>({}));principal=me.clientPrincipal||null;renderAuth();if(principal)await loadTeams();else renderLogin()}
function renderAuth(){let a=document.querySelector('#auth');a.innerHTML=principal?`<span>${esc(principal.userDetails)}</span><a class="btn btn2" href="/.auth/logout?post_logout_redirect_uri=/">Uitloggen</a>`:`<a class="btn" href="/.auth/login/aad?post_login_redirect_uri=/">Inloggen / account aanmaken</a>`}
function renderLogin(){document.querySelector('#app').innerHTML=`<section class="card"><h2>Welkom</h2><p>Log in of maak via Microsoft Entra External ID een account aan. Het wachtwoord wordt niet door deze app opgeslagen.</p><a class="btn" style="display:inline-block;text-decoration:none" href="/.auth/login/aad?post_login_redirect_uri=/">Inloggen / registreren</a></section>`}
async function loadTeams(){try{teams=await api('teams')||[];renderTeams()}catch(e){document.querySelector('#app').innerHTML=`<div class="card"><h2>Kan teams niet laden</h2><p>${esc(e.message)}</p></div>`}}
function renderTeams(){document.querySelector('#app').innerHTML=`<section class="card"><div class="row"><div><h2>Mijn teams</h2><div class="muted">Iedere gebruiker kan teams aanmaken.</div></div><button class="btn" onclick="newTeamForm()">Nieuw team</button></div><div class="grid">${teams.map(t=>`<article class="card team" onclick="openTeam('${t.teamId}')"><h3>${esc(t.teamName)}</h3><span class="pill">${esc(t.role)}</span><div class="muted">Seizoen ${esc(t.season||'niet ingesteld')}</div></article>`).join('')||'<p class="muted">Nog geen teams.</p>'}</div><div id="form"></div></section>`}
function newTeamForm(){document.querySelector('#form').innerHTML=`<div class="card"><h3>Nieuw team</h3><div class="grid2"><div><label>Teamnaam</label><input id="tn" class="input"></div><div><label>Seizoen</label><input id="ts" class="input" placeholder="2026-2027"></div></div><button class="btn" onclick="createTeam()">Aanmaken</button></div>`}
async function createTeam(){let teamName=document.querySelector('#tn').value.trim(),season=document.querySelector('#ts').value.trim();if(!teamName)return;await api('teams',{method:'POST',body:JSON.stringify({teamName,season})});await loadTeams()}
async function openTeam(id){selected=await api('teams/'+id);tab='dashboard';renderTeam()}
async function editTeam(){

  const newName =
    prompt(
      'Teamnaam',
      selected.teamName
    );

  if(!newName)
    return;

  const newSeason =
    prompt(
      'Seizoen',
      selected.season || ''
    );

  await api(
    'teams/' + selected.teamId,
    {
      method: 'PUT',
      body: JSON.stringify({
        teamName: newName,
        season: newSeason
      })
    }
  );

  selected.teamName =
    newName;

  selected.season =
    newSeason;

  renderTeam();

}
function nav(){return`<div class="nav"><button class="btn btn2" onclick="showTab('dashboard')">Dashboard</button><button class="btn btn2" onclick="showTab('players')">Spelers</button><button class="btn btn2" onclick="showTab('matches')">Wedstrijden</button><button class="btn btn2" onclick="showTab('members')">Coaches</button><button class="btn btn2" onclick="showTab('report')">Power BI export</button></div>`}
async function showTab(x){tab=x;renderTeam()}
async function renderTeam(){let a=document.querySelector('#app');a.innerHTML=`<button class="btn btn2" onclick="loadTeams()">← Mijn teams</button><section class="card"><div class="row"><div><h2>${esc(selected.teamName)}</h2><span class="pill">${esc(selected.role)}</span><br>

<button
  class="btn btn2"
  onclick="editTeam()"
>
  Team wijzigen
</button></div><div class="muted">${esc(selected.season)}</div></div>${nav()}<div id="pane" class="card">Laden...</div></section>`;let p=document.querySelector('#pane');if(tab==='dashboard')dashboard(p);if(tab==='players')players(p);if(tab==='matches')matches(p);if(tab==='members')members(p);if(tab==='report')report(p)}
async function dashboard(p){let d=await api('dashboard?teamId='+selected.teamId);p.innerHTML=`<h3>Dashboard</h3><div class="grid"><div class="card"><div class="muted">Spelers</div><div class="stat">${d.players}</div></div><div class="card"><div class="muted">Wedstrijden</div><div class="stat">${d.matches}</div></div><div class="card"><div class="muted">Sets</div><div class="stat">${d.sets}</div></div></div>`}
async function players(p){let x=await api('players?teamId='+selected.teamId);p.innerHTML=`<div class="row"><h3>Spelers</h3><button class="btn" onclick="playerForm()">Speler toevoegen</button></div><div id="plist">${x.map(v=>`<div class="row"><div><b>${esc(v.name)}</b><div class="muted">#${esc(v.number)} · ${esc(v.role)}</div></div><span class="pill">${v.active?'Actief':'Inactief'}</span><button
  class="btn btn2"
  onclick="
    editPlayer(
      '${v.playerId}'
    )
  "
>
  Bewerken
</button></div>`).join('')||'<p class="muted">Geen spelers.</p>'}</div><div id="pform"></div>`}
function playerForm(){document.querySelector('#pform').innerHTML=`<div class="card grid"><input id="pn" class="input" placeholder="Naam"><input id="pno" class="input" placeholder="Rugnummer"><select id="pr" class="input"><option>Setter</option><option>Diagonaal</option><option>Midden</option><option>Buiten</option><option>Libero</option></select><button class="btn" onclick="addPlayer()">Opslaan</button></div>`}
async function addPlayer(){await api('players',{method:'POST',body:JSON.stringify({teamId:selected.teamId,name:document.querySelector('#pn').value,number:document.querySelector('#pno').value,role:document.querySelector('#pr').value})});players(document.querySelector('#pane'))}
async function editPlayer(
  playerId
){

  let playersList =
    await api(
      'players?teamId=' +
      selected.teamId
    );

  let player =
    playersList.find(
      p =>
      p.playerId === playerId
    );

  let newName =
    prompt(
      'Naam',
      player.name
    );

  if(!newName) return;

  let newNumber =
    prompt(
      'Rugnummer',
      player.number || ''
    );

  await api(
    'players/' +
    playerId,
    {
      method:'PUT',
      body:JSON.stringify({
        teamId:selected.teamId,
        name:newName,
        number:newNumber,
        role:player.role
      })
    }
  );

  players(
    document.querySelector(
      '#pane'
    )
  );
}
async function matches(p){let x=await api('matches?teamId='+selected.teamId);p.innerHTML=`<div class="row"><h3>Wedstrijden</h3><button class="btn" onclick="matchForm()">Wedstrijd toevoegen</button></div>${x.map(m=>`<div class="row"><div><b>${esc(m.opponent)}</b><div class="muted">${esc(m.matchDate)} · ${esc(m.location)}</div></div><div class="row-actions"><span class="pill">${esc(m.status)}</span><button class="btn ${m.status==='Completed'?'btn2':''}" onclick="openLiveMatch('${m.matchId}','${esc(m.status)}')">${m.status==='Planned'?'Start scoreregistratie':'Open wedstrijd'}</button></div></div>`).join('')||'<p class="muted">Geen wedstrijden.</p>'}<div id="mform"></div>`}
function matchForm(){document.querySelector('#mform').innerHTML=`<div class="card grid"><input id="mo" class="input" placeholder="Tegenstander"><input id="md" class="input" type="date"><input id="ml" class="input" placeholder="Locatie"><button class="btn" onclick="addMatch()">Opslaan</button></div>`}
async function addMatch(){await api('matches',{method:'POST',body:JSON.stringify({teamId:selected.teamId,opponent:document.querySelector('#mo').value,matchDate:document.querySelector('#md').value,location:document.querySelector('#ml').value})});matches(document.querySelector('#pane'))}
const ROTATION_SEQUENCE=['setter','buiten1','midden1','dia','buiten2','midden2'];
const ROLE_LABELS={setter:'Setter',buiten1:'Buiten 1',midden1:'Midden 1',dia:'Diagonaal',buiten2:'Buiten 2',midden2:'Midden 2'};
const VISUAL={team:{1:{setter:[81,88],buiten1:[80,26],midden1:[49,26],dia:[17,26],buiten2:[17,88],midden2:[49,88]},2:{setter:[49,88],buiten1:[88,88],midden1:[81,26],dia:[49,26],buiten2:[18,26],midden2:[18,88]},3:{setter:[18,88],buiten1:[49,88],midden1:[81,88],dia:[81,26],buiten2:[49,26],midden2:[18,26]},4:{setter:[20,26],buiten1:[20,77],midden1:[49,77],dia:[76,77],buiten2:[76,26],midden2:[49,26]},5:{setter:[49,26],buiten1:[20,26],midden1:[20,77],dia:[49,77],buiten2:[74,77],midden2:[74,26]},6:{setter:[76,26],buiten1:[49,26],midden1:[20,26],dia:[20,77],buiten2:[49,77],midden2:[76,77]}},opponent:{1:{setter:[89,88],buiten1:[80,83],midden1:[49,26],dia:[24,40],buiten2:[17,88],midden2:[49,88]},2:{setter:[62,26],buiten1:[74,68],midden1:[81,44],dia:[68,15],buiten2:[20,66],midden2:[56,83]},3:{setter:[44,37],buiten1:[49,88],midden1:[76,77],dia:[81,26],buiten2:[26,74],midden2:[18,26]},4:{setter:[6,9],buiten1:[20,77],midden1:[66,76],dia:[82,88],buiten2:[48,77],midden2:[7,20]},5:{setter:[55,28],buiten1:[27,67],midden1:[49,75],dia:[59,89],buiten2:[68,72],midden2:[75,39]},6:{setter:[69,11],buiten1:[13,66],midden1:[7,26],dia:[26,89],buiten2:[49,77],midden2:[76,77]}}};
async function openLiveMatch(matchId,status){liveMatchId=matchId;let p=document.querySelector('#pane');p.innerHTML='<p>Wedstrijd laden...</p>';try{if(status==='Planned')await api('live/start',{method:'POST',body:JSON.stringify({teamId:selected.teamId,matchId})});liveData=await api('phase2/status?teamId='+selected.teamId+'&matchId='+matchId);teamPlayers=await api('players?teamId='+selected.teamId);renderLive(p)}catch(e){p.innerHTML=`<h3>Kan wedstrijd niet openen</h3><p>${esc(e.message)}</p><button class="btn btn2" onclick="showTab('matches')">Terug</button>`}}
function renderLive(p=document.querySelector('#pane')){let d=liveData,m=d.match,s=d.currentSet,ln=d.lineup,decided=d.teamSets>=3||d.opponentSets>=3,readOnly=m.status==='Completed';p.innerHTML=`<div class="row"><div><h3>${esc(selected.teamName)} tegen ${esc(m.opponent)}</h3><div class="muted">${esc(m.matchDate)} · ${esc(m.location)}</div></div><button class="btn btn2" onclick="showTab('matches')">Terug naar wedstrijden</button></div><div class="live-tabs"><button class="btn btn2" onclick="showLiveScore()">Score</button><button class="btn btn2" onclick="showLineup()">Opstelling en veld</button></div><div id="livebody"></div>`;showLiveScore()}
function showLiveScore(){let p=document.querySelector('#livebody'),d=liveData,m=d.match,s=d.currentSet,ln=d.lineup,decided=d.teamSets>=3||d.opponentSets>=3,readOnly=m.status==='Completed';if(!ln&&!readOnly){p.innerHTML='<div class="card"><h3>Opstelling vereist</h3><p>Sla eerst de opstelling van deze set op voordat punten kunnen worden geregistreerd.</p><button class="btn" onclick="showLineup()">Opstelling invullen</button></div>';return}p.innerHTML=`<div class="scoreboard"><div><div>${esc(selected.teamName)}</div><div class="score-num score-us">${s?s.teamScore:0}</div></div><div><div class="set-tally">${d.teamSets} - ${d.opponentSets}</div><div class="muted">${s?'Set '+s.setNumber:'Wedstrijd'}${ln?' · rotatie '+ln.rotation:''}</div><div class="muted">${ln?(ln.serving==='team'?esc(selected.teamName):esc(m.opponent))+' serveert':''}</div></div><div><div>${esc(m.opponent)}</div><div class="score-num score-opp">${s?s.opponentScore:0}</div></div></div>${!readOnly&&s&&!s.completed?`<div class="point-grid"><button class="btn" onclick="addPoint('team')">Punt voor ${esc(selected.teamName)}</button><button class="btn danger" onclick="addPoint('opponent')">Punt voor ${esc(m.opponent)}</button></div><button class="btn btn2" onclick="undoPoint()">Laatste punt ongedaan maken</button>`:''}${!readOnly&&s&&s.completed&&!decided?'<button class="btn" onclick="nextSet()">Volgende set starten</button>':''}${!readOnly&&decided?'<button class="btn" onclick="finishMatch()">Wedstrijd afronden</button>':''}<div class="set-list">${d.sets.map(x=>`<div class="set-chip">Set ${x.setNumber}: <b>${x.teamScore}-${x.opponentScore}</b>${x.completed?' ✓':''}</div>`).join('')}</div><div class="card history"><h3>Puntenhistorie huidige set</h3>${[...d.points].reverse().map(x=>`<div class="row"><span>${x.winner==='team'?esc(selected.teamName):esc(m.opponent)}</span><b>${x.teamScore}-${x.opponentScore}</b></div>`).join('')||'<p class="muted">Nog geen punten.</p>'}</div>`}
function playerOptions(selectedId=''){return '<option value="">Selecteer speler</option>'+teamPlayers.filter(x=>x.active!==false).map(x=>`<option value="${x.playerId}" ${x.playerId===selectedId?'selected':''}>#${esc(x.number)} ${esc(x.name)}</option>`).join('')}
function showLineup(){let p=document.querySelector('#livebody'),d=liveData,s=d.currentSet,ln=d.lineup;if(!s){p.innerHTML='<p>Geen actieve set.</p>';return}let disabled=d.match.status==='Completed'?'disabled':'';p.innerHTML=`<div class="card"><h3>Opstelling set ${s.setNumber}</h3><div class="lineup-grid">${ROTATION_SEQUENCE.map(r=>`<div><label>${ROLE_LABELS[r]}</label><select ${disabled} class="input lineup-player" data-role="${r}">${playerOptions(ln?.players?.[r]?.playerId||'')}</select></div>`).join('')}</div><div class="grid2"><div><label>Wie start op positie 1?</label><select ${disabled} id="startRole" class="input">${ROTATION_SEQUENCE.map(r=>`<option value="${r}" ${ln?.startRole===r?'selected':''}>${ROLE_LABELS[r]}</option>`).join('')}</select></div><div><label>Eerste service</label><select ${disabled} id="initialServer" class="input"><option value="team" ${ln?.initialServer==='team'?'selected':''}>${esc(selected.teamName)}</option><option value="opponent" ${ln?.initialServer==='opponent'?'selected':''}>${esc(d.match.opponent)}</option></select></div></div>${disabled?'':'<button class="btn" onclick="saveLineup()">Opstelling opslaan</button>'}</div>${ln?courtHtml(ln):'<p class="muted">Na opslaan verschijnt hier de veldopstelling.</p>'}`}
function courtHtml(ln){let mode=ln.serving==='team'?'team':'opponent',layout=VISUAL[mode][ln.rotation];return`<div class="card"><div class="row"><h3>Veldopstelling</h3><span class="pill">Rotatie ${ln.rotation} · ${ln.serving==='team'?esc(selected.teamName):esc(liveData.match.opponent)} serveert</span></div><div class="court"><div class="net">NET</div><div class="courtgrid">${ROTATION_SEQUENCE.map(r=>{let xy=layout[r],pl=ln.players[r];return`<div class="court-player" style="left:${xy[0]}%;top:${xy[1]}%"><div class="court-role">${ROLE_LABELS[r]}</div><b>${esc(pl.name)}</b></div>`}).join('')}</div></div></div>`}
async function saveLineup(){let players={};document.querySelectorAll('.lineup-player').forEach(x=>players[x.dataset.role]={playerId:x.value});try{liveData=await api('lineup/save',{method:'POST',body:JSON.stringify({teamId:selected.teamId,matchId:liveMatchId,setNumber:liveData.currentSet.setNumber,players,startRole:document.querySelector('#startRole').value,initialServer:document.querySelector('#initialServer').value})});renderLive()}catch(e){alert(e.message)}}
async function phase2Action(path,body={}){try{liveData=await api(path,{method:'POST',body:JSON.stringify({teamId:selected.teamId,matchId:liveMatchId,...body})});renderLive()}catch(e){alert(e.message)}}
async function addPoint(winner){await phase2Action('phase2/point',{winner})}
async function undoPoint(){await phase2Action('phase2/undo')}
async function nextSet(){await api('live/next-set',{method:'POST',body:JSON.stringify({teamId:selected.teamId,matchId:liveMatchId})});liveData=await api('phase2/status?teamId='+selected.teamId+'&matchId='+liveMatchId);renderLive()}
async function finishMatch(){await api('live/finish',{method:'POST',body:JSON.stringify({teamId:selected.teamId,matchId:liveMatchId})});liveData=await api('phase2/status?teamId='+selected.teamId+'&matchId='+liveMatchId);renderLive()}
async function members(p){let x=await api('members?teamId='+selected.teamId);p.innerHTML=`<div class="row"><h3>Teamleden</h3>${selected.role==='Owner'?'<button class="btn" onclick="inviteForm()">Uitnodigen</button>':''}</div>${x.map(m=>`<div class="row"><div>${esc(m.email)}</div><span class="pill">${esc(m.role)}</span></div>`).join('')}<div id="iform"></div>`}
function inviteForm(){document.querySelector('#iform').innerHTML=`<div class="card grid2"><input id="ie" class="input" type="email" placeholder="E-mailadres"><select id="ir" class="input"><option>Coach</option><option>Viewer</option></select><button class="btn" onclick="invite()">Uitnodiging vastleggen</button></div>`}
async function invite(){await api('invitations',{method:'POST',body:JSON.stringify({teamId:selected.teamId,email:document.querySelector('#ie').value,role:document.querySelector('#ir').value})});alert('Uitnodiging vastgelegd. De gebruiker krijgt toegang na registratie met hetzelfde e-mailadres.');members(document.querySelector('#pane'))}
function report(p){p.innerHTML=`<h3>Power BI-export</h3><p>Download genormaliseerde teamgegevens als JSON voor Power BI of verdere verwerking.</p><a class="btn" style="display:inline-block;text-decoration:none" href="/api/report-phase2?teamId=${selected.teamId}" target="_blank">Rapportagegegevens openen</a>`}
init();</script>
